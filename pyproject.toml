[build-system]
requires = ["setuptools>=63", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragwort"
authors = [{ name = "AstreaTSS" }]
description = "Unstable experiments with pycord."
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["ragwort", "pycord", "discord"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dynamic = ["version", "dependencies"]

[project.urls]
Homepage = "https://github.com/Astrea-Stellarium-Labs/ragwort"

[tool.setuptools.dynamic]
version = { attr = "ragwort.__version__" }
dependencies = { file = ["requirements.txt"] }

[tool.ruff]
line-length = 88
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "migrations",
]
target-version = "py310"
fix = true

[tool.ruff.lint]
select = [
    "E",
    "F",
    "UP",
    "N",
    "YTT",
    "ANN",
    "S",
    "B",
    "A",
    "C4",
    "T20",
    "RET",
    "SIM",
    "I",
    "ASYNC",
    "N",
    "UP",
    "DTZ",
    "G",
    "PIE",
    "TCH",
    "ARG",
    "RUF",
]
ignore = [
    "E501",
    "E402",
    "B003",
    "ANN101",
    "ANN102",
    "RET506",
    "ANN401",
    "B008",
    "N806",
    "A003",
    "N818",
    "UP007",
    "SIM118",
    "RET502",
    "RET503",
    "SIM114",
    "S603",
    "S607",
    "SIM117",
    "F403",
    "F405",
    "N802",

    # todo: these should be removed at some point
    "ANN001",
    "ANN002",
    "ANN003",
    "ANN201",
    "ANN202",
    "ANN204",
    "RUF012",
]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
